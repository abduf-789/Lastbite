<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your profile — LastBite</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="profile">
<div id="site-header"></div>

<section class="wrap section" style="padding-bottom:0;">
  <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--forest-700);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;" id="avatar"></div>
    <div>
      <h2 style="margin:0;" id="profile-name"></h2>
      <p class="hint" id="profile-email"></p>
    </div>
    <div style="margin-left:auto;" class="pill amber" id="impact-score-pill"></div>
  </div>
</section>

<section class="wrap section">
  <div class="tabbar">
    <button class="on" data-tab="orders" id="tab-btn-orders">Orders</button>
    <button data-tab="donations">Donations</button>
    <button data-tab="notifications">Notifications</button>
    <button data-tab="account">Account</button>
  </div>

  <div id="tab-orders"><div id="orders-list"></div></div>
  <div id="tab-donations" hidden><div id="donations-list"></div></div>
  <div id="tab-notifications" hidden>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button class="btn btn-ghost btn-sm" id="mark-read">Mark all as read</button>
    </div>
    <div id="notifications-list"></div>
  </div>
  <div id="tab-account" hidden>
    <div class="card" style="max-width:520px;">
      <div class="field"><label>Full name</label><input type="text" id="acc-name"></div>
      <div class="field"><label>Email</label><input type="email" id="acc-email"></div>
      <div class="field"><label>Delivery address</label><textarea id="acc-address"></textarea></div>
      <div class="field"><label>Roles on this account</label><p id="acc-roles" class="hint"></p></div>
      <button class="btn btn-primary" id="acc-save">Save changes</button>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<div id="bottom-nav"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
